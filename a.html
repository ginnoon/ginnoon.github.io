<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>GSAP Infinite Marquee</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

<style>
body{
    background:#111;
    color:#fff;
    overflow-x:hidden;
    font-size:48px;
    font-weight:bold;
}

.marquee{
    overflow:hidden;
    width:100%;
    padding:30px 0;
    border-top:1px solid #444;
    border-bottom:1px solid #444;
}

.track{
    display:flex;
    width:max-content;
    will-change:transform;
}

.group{
    display:flex;
    flex-shrink:0;
    gap:4rem;
    padding-inline:2rem;
}
</style>
</head>
<body>

<div class="marquee">
    <div class="track">
        <div class="group">
            <span>TAILWIND</span>
            <span>GSAP</span>
            <span>MARQUEE</span>
            <span>INFINITE</span>
            <span>SCROLL</span>
            <span>ANIMATION</span>
        </div>
    </div>
</div>

<script>
const track = document.querySelector(".track");
const group = track.querySelector(".group");

// 여러 번 복제해서 빈 공간이 절대 안 생기게
while (track.offsetWidth < window.innerWidth * 2) {
    track.appendChild(group.cloneNode(true));
}

const distance = group.offsetWidth;

gsap.to(track, {
    x: `-=${distance}`,
    duration: 12,
    ease: "none",
    repeat: -1,
    modifiers: {
        x: x => `${parseFloat(x) % distance}px`
    }
});

addEventListener("resize", () => location.reload());
</script>

</body>
</html>
